name: Deploy .NET API to IIS

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Publish API
      run: dotnet publish ./src/Host/WebAPI/WebAPI.csproj -c Release -o ./publish

    - name: Deploy to IIS
      shell: powershell
      run: |
        try {
          # 1. Stop the App Pool to release file locks
          Stop-WebAppPool -Name "Retailer" -ErrorAction SilentlyContinue
          $timeout = 15
          while ((Get-WebAppPoolState -Name "Retailer").Value -ne 'Stopped' -and $timeout -gt 0) {
            Start-Sleep -Seconds 1
            $timeout--
          }
          # Ensure any lingering w3wp processes for Retailer are stopped
          Get-CimInstance Win32_Process -Filter "Name = 'w3wp.exe'" -ErrorAction SilentlyContinue |
            Where-Object { $_.CommandLine -like "*Retailer*" } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

          # 2. Copy published files using robocopy with retries
          robocopy "./publish" "D:\Websites\Retailer_API" /E /R:5 /W:2 /NP /NFL /NDL
          if ($LASTEXITCODE -ge 8) {
            throw "Robocopy failed with exit code $LASTEXITCODE"
          }
        }
        finally {
          # 3. Always ensure the App Pool is started back up
          Start-WebAppPool -Name "Retailer" -ErrorAction SilentlyContinue
        }
